<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&family=Kaushan+Script&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Pensado para el navegador de Tizen 6 (Chromium 76): nada de gap en flex ni ?. / ?? en JS. */
  :root {
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.75);
    --glass: rgba(20, 22, 30, 0.32);
    --glass-border: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05060a; color: var(--text);
    font-family: "Inter", "SamsungOne", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fondo: fotos 4K con zoom lento y fundido ---------- */
  #bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden;
        background: radial-gradient(120% 90% at 20% 10%, #23395d 0%, #0b1020 55%, #04050a 100%); }
  .photo {
    position: absolute; top: -3%; left: -3%; width: 106%; height: 106%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2.5s ease;
    will-change: transform, opacity;
  }
  .photo.show { opacity: 1; }
  .photo.kb1 { animation: kb1 140s linear forwards; }
  .photo.kb2 { animation: kb2 140s linear forwards; }
  @keyframes kb1 { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -1.5%); } }
  @keyframes kb2 { from { transform: scale(1.12) translate(2%, 1%); } to { transform: scale(1) translate(0, 0); } }
  #shade {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.65) 100%);
  }
  #credit {
    position: fixed; right: 3.2vw; bottom: 1.4vw; font-size: 0.75vw; color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6); max-width: 40vw; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Cabecera: hora y tiempo ---------- */
  header {
    position: fixed; top: 3.6vw; left: 4.2vw; right: 4.2vw;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  #time { font-size: 8.2vw; font-weight: 200; letter-spacing: -0.25vw; line-height: 0.95; text-shadow: 0 0.3vw 2vw rgba(0,0,0,0.35); }
  #date { font-size: 1.55vw; font-weight: 500; color: var(--text-soft); margin-top: 0.9vw; text-shadow: 0 0.2vw 1vw rgba(0,0,0,0.4); }

  .glass {
    background: var(--glass); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(36px) saturate(1.5); backdrop-filter: blur(36px) saturate(1.5);
  }
  #weather { width: 27vw; padding: 1.3vw 1.6vw 1.2vw; border-radius: 1.6vw; opacity: 0; transition: opacity 1s ease; }
  #weather.ready { opacity: 1; }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; }
  #w-city { font-size: 1.15vw; font-weight: 600; }
  #w-temp { font-size: 3.9vw; font-weight: 300; line-height: 1; margin-top: 0.2vw; }
  .w-right { text-align: right; }
  #w-icon { width: 2.6vw; height: 2.6vw; margin-left: auto; }
  #w-desc { font-size: 0.95vw; font-weight: 600; margin-top: 0.5vw; }
  #w-hilo { font-size: 0.95vw; font-weight: 500; color: var(--text-soft); margin-top: 0.2vw; }
  #w-hours { display: flex; justify-content: space-between; margin-top: 1vw; padding-top: 0.9vw; border-top: 1px solid rgba(255,255,255,0.18); }
  .hr { text-align: center; width: 3.6vw; }
  .hr-t { font-size: 0.8vw; font-weight: 600; color: var(--text-soft); }
  .hr-i { width: 1.7vw; height: 1.7vw; margin: 0.45vw auto; }
  .hr-v { font-size: 1vw; font-weight: 600; }

  /* ---------- Iconos ---------- */
  #rows { position: fixed; left: 0; right: 0; bottom: 3.4vw; }
  .row { display: flex; justify-content: center; }
  .row + .row { margin-top: 2.1vw; }
  #row0 { width: max-content; margin: 0 auto; padding: 1.1vw 1vw; border-radius: 2.4vw;
           background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.16);
           -webkit-backdrop-filter: blur(40px) saturate(1.4); backdrop-filter: blur(40px) saturate(1.4); }
  #label {
    position: fixed; left: 0; right: 0; text-align: center;
    font-size: 1.35vw; font-weight: 600; letter-spacing: 0.02vw;
    opacity: 0; transition: opacity 0.25s ease, top 0.25s ease;
    text-shadow: 0 0.2vw 1vw rgba(0,0,0,0.5);
  }
  #label.show { opacity: 1; }
  #label small { display: block; font-size: 0.85vw; font-weight: 500; color: var(--text-soft); margin-top: 0.25vw; }
  .tile {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    box-shadow: 0 0.5vw 1.4vw rgba(0,0,0,0.4);
    transform: scale(1); transition: transform 0.28s cubic-bezier(.2,.8,.2,1), box-shadow 0.28s ease;
    color: #fff; line-height: 1;
  }
  .big, .small { width: 11.2vw; height: 6.72vw; margin: 0 0.55vw; border-radius: 1.15vw; }
  .tile.focus { transform: scale(1.15) translateY(-0.6vw); box-shadow: 0 1.8vw 3vw rgba(0,0,0,0.6); z-index: 2; }
  .tile.pressed { transform: scale(1.06); }
  .tile::after {
    content: ""; position: absolute; top: -50%; left: -60%; width: 50%; height: 200%;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(20deg) translateX(-200%); opacity: 0;
  }
  .tile.focus::after { animation: shine 1.1s ease 0.15s 1; }
  @keyframes shine { 0% { opacity: 1; transform: rotate(20deg) translateX(-100%); } 100% { opacity: 0; transform: rotate(20deg) translateX(520%); } }
  .badge {
    position: absolute; top: 0.45vw; right: 0.5vw; font-size: 0.55vw; font-weight: 700; letter-spacing: 0.04vw;
    padding: 0.18vw 0.4vw; border-radius: 0.4vw; background: rgba(0,0,0,0.35); color: rgba(255,255,255,0.9);
  }

  /* Composiciones propias: colores y tipografías de cada marca, sin copiar sus logotipos */
  .tile b, .tile i, .tile em { font-style: normal; }
  .t-netflix  { background: radial-gradient(120% 120% at 50% 40%, #1c1c1e 0%, #000 75%); }
  .t-netflix b { font-family: "Bebas Neue", "Inter", sans-serif; color: #e50914; font-size: 3.4em; letter-spacing: 0.02em; }
  .t-hbo      { background: linear-gradient(180deg, #232326 0%, #0c0c0d 100%); text-align: center; }
  .t-hbo b    { display: block; font-family: "Montserrat"; font-weight: 900; font-size: 2.2em; letter-spacing: -0.06em; line-height: 0.82; }
  .t-hbo em   { display: block; font-family: "Montserrat"; font-weight: 800; font-size: 2.2em; letter-spacing: -0.05em; line-height: 0.82; }
  .t-appletv  { background: linear-gradient(180deg, #232326 0%, #0c0c0d 100%); }
  .t-appletv b{ display: flex; align-items: center; }
  .t-appletv svg { width: 2.3em; height: 2.75em; margin-right: 0.15em; margin-top: -0.25em; }
  .t-appletv b span { font-weight: 600; font-size: 3.8em; letter-spacing: -0.05em;
                background: linear-gradient(100deg, #ff9b6a 0%, #ff5fa2 30%, #9b7bff 60%, #4fd1ff 100%);
                -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
  .t-disney   { background: radial-gradient(130% 110% at 50% 85%, #2a5bb8 0%, #13286a 45%, #070f2e 100%); }
  .t-disney .arc { width: 78%; height: 1.6em; margin-bottom: -0.6em; }
  .t-disney b { font-family: "Kaushan Script", cursive; font-weight: 400; font-size: 2.35em; text-shadow: 0 0 0.35em rgba(160,200,255,0.35); }
  .t-disney b span { font-family: "Montserrat"; font-weight: 600; font-size: 0.75em; margin-left: 0.05em; }
  .t-mov, .t-mov-sp { background: linear-gradient(180deg, #232326 0%, #0c0c0d 100%); }
  .t-mov b, .t-mov-sp b { font-family: "Montserrat"; font-weight: 900; font-size: 2.6em; letter-spacing: -0.04em; line-height: 1; }
  .t-mov small, .t-mov-sp small { font-family: "Montserrat"; font-weight: 700; font-size: 0.78em; letter-spacing: 0.16em;
                 text-transform: uppercase; margin-top: 0.3em; color: #019df4; }
  .t-prime    { background: #4f6fe4; }
  .t-prime b  { font-family: "Montserrat"; font-weight: 700; font-size: 1.75em; letter-spacing: -0.04em; }
  .t-prime .smile { width: 3.6em; height: 1em; margin-top: -0.1em; }
  .t-youtube  { background: #f4f4f4; }
  .t-youtube b { display: flex; align-items: center; color: #0f0f0f; font-family: "Oswald", "Inter", sans-serif; font-weight: 500; font-size: 2.3em; letter-spacing: -0.03em; }
  .t-youtube svg { width: 1.15em; height: 0.82em; margin-right: 0.15em; }
  .t-plex     { background: #0c0c0d; }
  .t-plex b   { font-family: "Montserrat"; font-weight: 800; font-size: 2.7em; letter-spacing: -0.06em; display: flex; align-items: center; }
  .t-plex svg { width: 0.6em; height: 0.78em; margin-left: 0.02em; }
  .t-dazn     { background: #0c0c0d; }
  .t-dazn b   { font-family: "Montserrat"; font-weight: 800; font-size: 1.45em; line-height: 0.98; letter-spacing: 0.12em;
                border: 0.1em solid #fff; padding: 0.22em 0.18em 0.18em 0.3em; text-align: center; }
  .t-filmin   { background: #121214; }
  .t-filmin b { font-family: "Bebas Neue", "Inter", sans-serif; font-size: 3.4em; color: #1fe06a; letter-spacing: 0.01em; }
  .t-twitch   { background: #9146ff; }
  .t-twitch svg { width: 3.6em; height: 3.9em; }
  .t-musica   { background: linear-gradient(180deg, #ff4f6d 0%, #ff1e44 100%); }
  .t-musica svg { width: 4.4em; height: 4.4em; }
  .t-usb      { background: linear-gradient(180deg, #a3a6ad 0%, #6c7079 100%); }
  .t-usb svg  { width: 4em; height: 4em; }
  .big, .small { font-size: 0.95vw; }

  /* ---------- Avisos ---------- */
  #toast {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.96);
    padding: 1.3vw 2.4vw; border-radius: 1.5vw; font-size: 1.5vw; font-weight: 500;
    opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
  <div id="bg"><div class="photo" id="p0"></div><div class="photo" id="p1"></div></div>
  <div id="shade"></div>
  <div id="credit"></div>

  <header>
    <div>
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <div id="weather" class="glass">
      <div class="w-top">
        <div>
          <div id="w-city">Barcelona</div>
          <div id="w-temp">--°</div>
        </div>
        <div class="w-right">
          <div id="w-icon"></div>
          <div id="w-desc"></div>
          <div id="w-hilo"></div>
        </div>
      </div>
      <div id="w-hours"></div>
    </div>
  </header>

  <div id="label"></div>
  <div id="rows"><div class="row" id="row0"></div><div class="row" id="row1"></div></div>
  <div id="toast" class="glass"></div>

<script>
// ===================== Configuración =====================
var BRIDGE = "http://127.0.0.1:8095";
var WEATHER = { city: "Barcelona", lat: 41.3874, lon: 2.1686 };
var PHOTO_SECONDS = 120;

// Posiciones en el menú Fuentes de la tele: 0 TV, 1 Apple TV, 2 barra de sonido, 3 Movistar, 4 USB
var SRC_APPLETV = 1, SRC_MOVISTAR = 3, SRC_USB = 4;

var USB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="9" width="10" height="13" rx="2"/><path d="M9 9V3h6v6M10.5 5.5h0M13.5 5.5h0"/></svg>';
var MUSIC_ICON = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5.8l11-2.3v11.2a2.5 2.5 0 1 1-2-2.45V7.2l-7 1.5z"/></svg>';
var YT_ICON = '<svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5.5" fill="#ff0000"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>';
var DISNEY_ARC = '<svg class="arc" viewBox="0 0 100 20" preserveAspectRatio="none"><defs><linearGradient id="dg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#bfe9ff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path d="M4 19C25 2 72 -2 97 12" stroke="url(#dg)" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
var PRIME_SMILE = '<svg class="smile" viewBox="0 0 60 16"><path d="M2 3c15 10 37 11 52 2" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M48 2l8 2-4 7" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Manzana genérica entera (no mordida), con el degradado de "tv"
var APPLE_SHAPE = '<svg viewBox="0 0 30 36"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9b6a"/><stop offset=".35" stop-color="#ff5fa2"/><stop offset=".7" stop-color="#9b7bff"/><stop offset="1" stop-color="#4fd1ff"/></linearGradient></defs>' +
  '<path d="M15 11c-2-2-5.5-2.6-8.2-1.4C2.6 11.4.6 16.4 2 22c1.3 5.4 4.8 11 8.6 11 1.8 0 2.7-1 4.4-1s2.6 1 4.4 1c3.8 0 7.3-5.6 8.6-11 1.4-5.6-.6-10.6-4.8-12.4C20.5 8.4 17 9 15 11z" fill="url(#ag)"/>' +
  '<path d="M15.5 9.5c.2-3.8 2.6-7 6.6-7.8-.3 3.9-2.8 7-6.6 7.8z" fill="url(#ag)"/></svg>';
var TWITCH_ICON = '<svg viewBox="0 0 24 26"><path d="M4 2h17v11.5l-5 5h-4l-3 3v-3H4z" fill="#fff"/><path d="M11 6.5v5M16 6.5v5" stroke="#9146ff" stroke-width="2.2" stroke-linecap="round"/></svg>';
var PLEX_X = '<svg viewBox="0 0 10 13"><path d="M1 0h4l4.5 6.5L5 13H1l4.5-6.5z" fill="#e5a00d"/></svg>';

// type: "atv" abre una app del Apple TV, "src" cambia de entrada, "module" abre un módulo de TizenBrew
var ROWS = [
  [
    { name: "Movistar+ Deportes", cls: "t-mov-sp",  type: "src", pos: SRC_MOVISTAR,           html: "<b>M+</b><small>Deportes</small>", sub: "Canales en directo en el descodificador", badge: "EN DIRECTO" },
    { name: "Movistar+ Movies",   cls: "t-mov",     type: "atv", id: "com.prisatv.yomvi",     html: "<b>M+</b><small>Movies</small>", sub: "Series y películas en el Apple TV" },
    { name: "Netflix",            cls: "t-netflix", type: "atv", id: "com.netflix.Netflix",   html: "<b>NETFLIX</b>" },
    { name: "HBO Max",            cls: "t-hbo",     type: "atv", id: "com.wbd.stream",        html: "<div><b>HBO</b><em>max</em></div>" },
    { name: "TV de Apple",        cls: "t-appletv", type: "atv", id: "com.apple.TVWatchList", html: "<b>" + APPLE_SHAPE + "<span>tv</span></b>" },
    { name: "Disney+",            cls: "t-disney",  type: "atv", id: "com.disney.disneyplus", html: DISNEY_ARC + "<b>Disney<span>+</span></b>" },
    { name: "Prime Video",        cls: "t-prime",   type: "atv", id: "com.amazon.aiv.AIVApp", html: "<b>prime video</b>" + PRIME_SMILE }
  ],
  [
    { name: "YouTube",     cls: "t-youtube", type: "module", module: "npm/@foxreis/tizentube", html: "<b>" + YT_ICON + "YouTube</b>", sub: "Sin anuncios, en la tele" },
    { name: "Filmin",      cls: "t-filmin",  type: "atv", id: "com.filmin.filmin", html: "<b>FILMIN</b>" },
    { name: "Plex",        cls: "t-plex",    type: "atv", id: "com.plexapp.plex",  html: "<b>ple" + PLEX_X + "</b>" },
    { name: "DAZN",        cls: "t-dazn",    type: "atv", id: "com.dazn.theApp",   html: "<b>DA<br>ZN</b>" },
    { name: "Twitch",      cls: "t-twitch",  type: "atv", id: "tv.twitch",         html: TWITCH_ICON },
    { name: "Música",      cls: "t-musica",  type: "atv", id: "com.apple.TVMusic", html: MUSIC_ICON },
    { name: "USB",         cls: "t-usb",     type: "src", pos: SRC_USB,            html: USB_ICON, sub: "Memoria conectada a la tele" }
  ]
];

// ===================== Utilidades =====================
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function request(method, path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, BRIDGE + path);
  xhr.timeout = 40000;
  if (body) xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onload = function () {
    var data = null;
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    cb(data && data.ok ? null : new Error((data && data.error) || "error " + xhr.status), data);
  };
  xhr.onerror = xhr.ontimeout = function () { cb(new Error("el puente no responde")); };
  xhr.send(body ? JSON.stringify(body) : null);
}
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "glass show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = "glass"; }, ms || 2500);
}

// ===================== Puente: credenciales guardadas en la tele =====================
// El puente pierde la configuración al reiniciarse; el lanzador la guarda y se la vuelve a dar.
function syncBridge(retries) {
  request("GET", "/status", null, function (err, s) {
    if (err) {
      if (retries > 0) setTimeout(function () { syncBridge(retries - 1); }, 1500);
      return;
    }
    if (s.atvCreds) storeSet("atvCreds", s.atvCreds);
    if (s.tvToken) storeSet("tvToken", s.tvToken);
    if (!s.hasCreds && storeGet("atvCreds")) {
      request("POST", "/config", { atvCreds: storeGet("atvCreds"), tvToken: storeGet("tvToken") || "" }, function () {});
    }
  });
}
function rememberToken(data) { if (data && data.tvToken) storeSet("tvToken", data.tvToken); }

// ===================== Fondos =====================
var photos = [], photoIdx = -1, layer = 0;
function loadPhotos() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "fondos.json");
  xhr.onload = function () {
    try { photos = JSON.parse(xhr.responseText); } catch (e) { photos = []; }
    for (var i = photos.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = photos[i]; photos[i] = photos[j]; photos[j] = t; }
    nextPhoto();
    setInterval(nextPhoto, PHOTO_SECONDS * 1000);
  };
  xhr.send();
}
function nextPhoto() {
  if (!photos.length) return;
  photoIdx = (photoIdx + 1) % photos.length;
  var p = photos[photoIdx];
  var img = new Image();
  img.onload = function () {
    var cur = document.getElementById("p" + layer);
    layer = 1 - layer;
    var nxt = document.getElementById("p" + layer);
    nxt.style.backgroundImage = "url('" + p.url + "')";
    nxt.className = "photo show " + (photoIdx % 2 ? "kb2" : "kb1");
    cur.className = cur.className.replace(" show", "");
    var credit = (p.name ? p.name + " — " : "") + (p.author || "") + (p.license ? " · " + p.license : "");
    document.getElementById("credit").textContent = credit;
  };
  img.onerror = function () { setTimeout(nextPhoto, 2000); };
  img.src = p.url;
}

// ===================== Hora =====================
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function updateClock() {
  var d = new Date();
  document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  var text;
  try { text = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }); }
  catch (e) { text = ""; }
  document.getElementById("date").textContent = text.charAt(0).toUpperCase() + text.slice(1);
}

// ===================== Tiempo (Open-Meteo, sin clave) =====================
var ICONS = {
  sun: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="#ffd54a"/><g stroke="#ffd54a" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g></svg>',
  moon: '<svg viewBox="0 0 48 48"><path d="M30 6a16 16 0 1 0 12 26A14 14 0 0 1 30 6z" fill="#e8ecff"/></svg>',
  partly: '<svg viewBox="0 0 48 48"><circle cx="18" cy="18" r="8" fill="#ffd54a"/><path d="M16 38h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 1 13z" fill="#fff"/></svg>',
  partlyNight: '<svg viewBox="0 0 48 48"><path d="M22 6a10 10 0 1 0 8 15A9 9 0 0 1 22 6z" fill="#e8ecff"/><path d="M16 40h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 1 13z" fill="#fff"/></svg>',
  cloud: '<svg viewBox="0 0 48 48"><path d="M13 36h23a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 0 15z" fill="#fff"/></svg>',
  fog: '<svg viewBox="0 0 48 48"><g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M8 18h32M5 26h38M10 34h28"/></g></svg>',
  rain: '<svg viewBox="0 0 48 48"><path d="M13 28h23a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 0 15z" fill="#fff"/><g stroke="#6ec6ff" stroke-width="3" stroke-linecap="round"><path d="M16 33l-2 6M24 33l-2 6M32 33l-2 6"/></g></svg>',
  snow: '<svg viewBox="0 0 48 48"><path d="M13 28h23a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 0 15z" fill="#fff"/><g fill="#dff3ff"><circle cx="16" cy="36" r="2"/><circle cx="24" cy="40" r="2"/><circle cx="32" cy="36" r="2"/></g></svg>',
  storm: '<svg viewBox="0 0 48 48"><path d="M13 28h23a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 0 15z" fill="#fff"/><path d="M25 30l-6 9h5l-3 7 9-11h-5l3-5z" fill="#ffd54a"/></svg>'
};
function weatherInfo(code, isDay) {
  if (code === 0) return [isDay ? ICONS.sun : ICONS.moon, "Despejado"];
  if (code === 1 || code === 2) return [isDay ? ICONS.partly : ICONS.partlyNight, "Parcialmente nublado"];
  if (code === 3) return [ICONS.cloud, "Nublado"];
  if (code === 45 || code === 48) return [ICONS.fog, "Niebla"];
  if (code >= 51 && code <= 57) return [ICONS.rain, "Llovizna"];
  if (code >= 61 && code <= 67) return [ICONS.rain, "Lluvia"];
  if (code >= 71 && code <= 77) return [ICONS.snow, "Nieve"];
  if (code >= 80 && code <= 82) return [ICONS.rain, "Chubascos"];
  if (code >= 85 && code <= 86) return [ICONS.snow, "Chubascos de nieve"];
  if (code >= 95) return [ICONS.storm, "Tormenta"];
  return [ICONS.cloud, ""];
}
function updateWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER.lat + "&longitude=" + WEATHER.lon +
    "&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day" +
    "&daily=temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=Europe%2FMadrid";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url);
  xhr.timeout = 15000;
  xhr.onload = function () {
    var d;
    try { d = JSON.parse(xhr.responseText); } catch (e) { return; }
    var c = d.current, now = weatherInfo(c.weather_code, c.is_day === 1);
    document.getElementById("w-city").textContent = WEATHER.city;
    document.getElementById("w-temp").textContent = Math.round(c.temperature_2m) + "°";
    document.getElementById("w-icon").innerHTML = now[0];
    document.getElementById("w-desc").textContent = now[1];
    document.getElementById("w-hilo").textContent = "Máx. " + Math.round(d.daily.temperature_2m_max[0]) + "°  Mín. " + Math.round(d.daily.temperature_2m_min[0]) + "°";
    // Próximas 6 horas a partir de la hora actual
    var h = d.hourly, start = 0, nowHour = c.time.slice(0, 13);
    for (var i = 0; i < h.time.length; i++) if (h.time[i].slice(0, 13) === nowHour) { start = i; break; }
    var html = "";
    for (var k = 1; k <= 6 && start + k < h.time.length; k++) {
      var j = start + k, info = weatherInfo(h.weather_code[j], h.is_day[j] === 1);
      html += '<div class="hr"><div class="hr-t">' + h.time[j].slice(11, 13) + '</div><div class="hr-i">' + info[0] +
              '</div><div class="hr-v">' + Math.round(h.temperature_2m[j]) + '°</div></div>';
    }
    document.getElementById("w-hours").innerHTML = html;
    document.getElementById("weather").className = "glass ready";
  };
  xhr.send();
}

// ===================== Iconos y mando =====================
var tiles = [[], []], fr = 0, fc = 0, labelTimer = null;
function build() {
  for (var r = 0; r < ROWS.length; r++) {
    var row = document.getElementById("row" + r);
    for (var c = 0; c < ROWS[r].length; c++) {
      var app = ROWS[r][c], el = document.createElement("div");
      el.className = "tile " + (r === 0 ? "big " : "small ") + app.cls;
      el.innerHTML = app.html + (app.badge ? '<div class="badge">' + app.badge + "</div>" : "");
      (function (rr, cc) {
        el.addEventListener("click", function () { focus(rr, cc); launch(); });
        el.addEventListener("mouseenter", function () { focus(rr, cc); });
      })(r, c);
      row.appendChild(el);
      tiles[r].push(el);
    }
  }
  focus(0, 0);
}
function focus(r, c) {
  var old = tiles[fr][fc];
  old.className = old.className.replace(" focus", "");
  fr = r;
  fc = Math.max(0, Math.min(c, tiles[r].length - 1));
  var el = tiles[fr][fc], app = ROWS[fr][fc];
  el.className += " focus";
  var label = document.getElementById("label"), rect = document.getElementById("row0").getBoundingClientRect();
  label.innerHTML = app.name + (app.sub ? "<small>" + app.sub + "</small>" : "");
  label.style.top = (rect.top - window.innerWidth * (app.sub ? 0.042 : 0.03)) + "px";
  label.className = "show";
  clearTimeout(labelTimer);
  labelTimer = setTimeout(function () { label.className = ""; }, 3000);
}
function move(dr, dc) {
  if (dr) {
    var nr = fr + dr;
    if (nr < 0 || nr >= tiles.length) return;
    // Al cambiar de fila, el icono más cercano en horizontal
    var x = tiles[fr][fc].getBoundingClientRect(), cx = x.left + x.width / 2, best = 0, bestD = 1e9;
    for (var i = 0; i < tiles[nr].length; i++) {
      var y = tiles[nr][i].getBoundingClientRect(), d = Math.abs(y.left + y.width / 2 - cx);
      if (d < bestD) { bestD = d; best = i; }
    }
    return focus(nr, best);
  }
  focus(fr, fc + dc);
}

function launch() {
  var app = ROWS[fr][fc], el = tiles[fr][fc];
  el.className += " pressed";
  setTimeout(function () { el.className = el.className.replace(" pressed", ""); }, 180);
  if (app.type === "module") { toast("Abriendo " + app.name + "…"); return launchModule(app.module); }
  if (app.type === "src") {
    toast("Cambiando a " + app.name + "…", 6000);
    return request("GET", "/tv/source?pos=" + app.pos, null, function (err, data) {
      rememberToken(data);
      if (err) toast("No se pudo cambiar de entrada: " + err.message, 5000);
    });
  }
  toast("Abriendo " + app.name + " en el Apple TV…", 6000);
  request("GET", "/atv/launch?id=" + encodeURIComponent(app.id), null, function (err) {
    if (err) return toast("No se pudo abrir " + app.name + ": " + err.message, 5000);
    request("GET", "/tv/source?pos=" + SRC_APPLETV, null, function (err2, data) {
      rememberToken(data);
      if (err2) toast("Abierta en el Apple TV, pero no pude cambiar de entrada", 5000);
    });
  });
}

// Abre otro módulo de TizenBrew igual que lo hace su propia interfaz
function launchModule(fullName) {
  if (typeof WebSocket === "undefined" || typeof tizen === "undefined") return;
  var ws;
  try { ws = new WebSocket("ws://localhost:8081"); } catch (e) { return toast("TizenBrew no responde"); }
  ws.onopen = function () { ws.send(JSON.stringify({ type: 4, payload: false })); };
  ws.onmessage = function (ev) {
    var data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }
    if (data.type !== 4) return;
    if (!data.payload) return setTimeout(function () { ws.send(JSON.stringify({ type: 4, payload: false })); }, 500);
    var mdl = null;
    for (var i = 0; i < data.payload.length; i++) if (data.payload[i].fullName === fullName) mdl = data.payload[i];
    if (!mdl) return toast("No encuentro TizenTube en TizenBrew");
    for (var k = 0; k < (mdl.keys || []).length; k++) { try { tizen.tvinputdevice.registerKey(mdl.keys[k]); } catch (e) {} }
    ws.send(JSON.stringify({ type: 5, payload: mdl }));
    if (!mdl.evaluateScriptOnDocumentStart) setTimeout(function () { location.href = mdl.appPath; }, 150);
  };
  ws.onerror = function () { toast("TizenBrew no responde"); };
}

document.addEventListener("keydown", function (e) {
  switch (e.keyCode) {
    case 37: move(0, -1); break;     // izquierda
    case 39: move(0, 1); break;      // derecha
    case 38: move(-1, 0); break;     // arriba
    case 40: move(1, 0); break;      // abajo
    case 13: launch(); break;        // OK
    case 10009: break;               // Atrás: no salir por error
    default: return;
  }
  e.preventDefault();
});

build();
updateClock();
setInterval(updateClock, 1000);
updateWeather();
setInterval(updateWeather, 15 * 60 * 1000);
loadPhotos();
syncBridge(10);
</script>
